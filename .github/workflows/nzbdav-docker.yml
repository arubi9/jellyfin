name: Build NZBDAV-patched Jellyfin image

on:
  push:
    branches:
      - nzbdav-sidecar
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.nzbdav
          push: true
          tags: |
            ghcr.io/arubi9/jellyfin-nzbdav:10.11.8
            ghcr.io/arubi9/jellyfin-nzbdav:latest
